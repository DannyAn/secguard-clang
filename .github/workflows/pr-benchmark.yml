name: pr-benchmark

on:
  pull_request:
    paths:
      - 'sgre/**'
      - 'examples/c-vuln-benchmark/**'
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build secguard
        working-directory: sgre
        run: |
          mkdir -p .tmpcache
          GOCACHE=$PWD/.tmpcache CGO_ENABLED=1 GOFLAGS=-mod=mod go build -buildvcs=false -o ../bin/secguard ./cmd/secguard

      - name: Run Go tests (nosqlite subset)
        working-directory: sgre
        run: |
          GOCACHE=$PWD/.tmpcache go test -buildvcs=false -tags nosqlite ./internal/log/ ./internal/planner/ ./internal/db/

      - name: Scan benchmark
        run: |
          rm -rf /tmp/bench && mkdir -p /tmp/bench
          cp -r examples/c-vuln-benchmark/src /tmp/bench/
          cd /tmp/bench
          $GITHUB_WORKSPACE/bin/secguard scan . --db /tmp/bench/sgre.db > scan.log 2>&1
          SCAN_ID=$(ls .codeagent/secguard-clang/scans | grep -v latest | head -1)
          $GITHUB_WORKSPACE/bin/secguard report --audit \
            --scan-id "$SCAN_ID" \
            --output-dir "/tmp/bench/.codeagent/secguard-clang/scans/$SCAN_ID" \
            --db /tmp/bench/sgre.db > audit.log 2>&1

      - name: Validate benchmark (FP=0 red line)
        run: |
          python3 examples/c-vuln-benchmark/scripts/validate-benchmark.py \
            --root /tmp/bench \
            --expected examples/c-vuln-benchmark/expected-results.json \
            --allow-fn
