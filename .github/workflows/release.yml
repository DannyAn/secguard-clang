name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl-linked Linux x86_64 — runs on any glibc/musl distro.
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: musl-gcc
            apt: musl-tools
            static: '1'
          # Windows x86_64 — cross-compiled from Linux via zig (mingw-w64).
          - name: windows-amd64
            os: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: zig
            apt: ''
            static: ''
          # Native macOS arm64 (Apple Silicon).
          - name: darwin-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            apt: ''
            static: ''
          # Intel macOS x86_64 — cross-compiled on the arm64 runner via clang.
          - name: darwin-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang
            apt: ''
            static: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: sgre/go.sum

      - name: Install Linux cross toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install zig (for windows cross-compile)
        if: matrix.cc == 'zig'
        run: |
          curl -fsSL https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd sgre
          artifact="../secguard-${{ matrix.goos }}-${{ matrix.goarch }}"
          case "${{ matrix.cc }}" in
            musl-gcc)
              CC=musl-gcc go build -trimpath \
                -ldflags "-linkmode external -extldflags '-static' -X github.com/DannyAn/secguard-clang/internal/cli.Version=${version}" \
                -o "${artifact}" ./cmd/secguard
              ;;
            zig)
              [ "${{ matrix.goos }}" = "windows" ] && artifact="${artifact}.exe"
              mkdir -p .zig-cache/global .zig-cache/local .gotmp
              CC="zig cc -target x86_64-windows-gnu" \
              CXX="zig c++ -target x86_64-windows-gnu" \
              CGO_CFLAGS="-Wno-dll-attribute-on-redeclaration" \
              CGO_CXXFLAGS="-Wno-dll-attribute-on-redeclaration" \
              GONOSUMDB='*' GOFLAGS=-mod=mod \
              ZIG_GLOBAL_CACHE_DIR="$(pwd)/.zig-cache/global" \
              ZIG_LOCAL_CACHE_DIR="$(pwd)/.zig-cache/local" \
              TMPDIR="$(pwd)/.gotmp" \
              go build -trimpath \
                -ldflags "-X github.com/DannyAn/secguard-clang/internal/cli.Version=${version}" \
                -o "${artifact}" ./cmd/secguard
              ;;
            *)
              go build -trimpath \
                -ldflags "-X github.com/DannyAn/secguard-clang/internal/cli.Version=${version}" \
                -o "${artifact}" ./cmd/secguard
              ;;
          esac
          echo "Built ${artifact}"
          file "${artifact}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secguard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: secguard-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    name: assemble & publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble single distribution zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          ls -la dist
          bash extension/dist/build-packages.sh --assemble-only --version "${GITHUB_REF_NAME#v}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/secguard-*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
